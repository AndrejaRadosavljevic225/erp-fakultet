# ERP Fakultet - Docker stack
#
# NAJLAKSE: dupli klik na start.bat (digne Docker, saceka spremnost, otvori aplikaciju)
#
# CEO STACK odjednom (baza + HR + Schedule + Gateway + frontend):
#     docker compose --profile app up -d --build --wait
# Zahvaljujuci healthcheck-ovima i --wait, komanda se zavrsava tek kad je sistem
# stvarno spreman za prijavu, a ne cim se kontejneri pokrenu.
# Aplikacija: http://localhost:3000   (prijava: admin / admin123)
#
# Samo baza (kad servise pokreces iz IntelliJ-a):
#     docker compose up -d
# Sa UI alatom (pgAdmin):
#     docker compose --profile tools up -d
# Gasenje:  docker compose --profile app down      (+ -v brise i podatke)

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_hr          # prva baza; ostale pravi init skripta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Opcioni UI alati (samo uz --profile tools) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erp-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@erp.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # --- Aplikacioni servisi (samo uz --profile app) ---
  hr-service:
    build:
      context: .
      dockerfile: hr-service/Dockerfile
    container_name: erp-hr-service
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_NAME: erp_hr
      DB_USER: erp
      DB_PASSWORD: erp
      JWT_SECRET: erp-fakultet-hr-service-super-tajni-kljuc-promeni-me-2026
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  schedule-service:
    build:
      context: .
      dockerfile: schedule-service/Dockerfile
    container_name: erp-schedule-service
    profiles: ["app"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_NAME: erp_schedule
      DB_USER: erp
      DB_PASSWORD: erp
      JWT_SECRET: erp-fakultet-hr-service-super-tajni-kljuc-promeni-me-2026
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: erp-api-gateway
    profiles: ["app"]
    environment:
      HR_URI: http://hr-service:8081
      SCHEDULE_URI: http://schedule-service:8083
      FINANCE_URI: http://finance-service:8082
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # Ceka da servisi budu ZDRAVI, ne samo pokrenuti — inace prve prijave vracaju 500
    depends_on:
      hr-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy

  # React frontend (nginx servira build i proksira /hr i /schedule na gateway)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    profiles: ["app"]
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres-data:
