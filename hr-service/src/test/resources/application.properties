# Konfiguracija SAMO za testove: baza u memoriji, bez Flyway-a i demo podataka.
# Ovaj fajl potpuno zamenjuje main/resources/application.properties tokom testova.
spring.application.name=hr-service-test

spring.datasource.url=jdbc:h2:mem:hr-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Demo podaci se ne upisuju; role i 'admin' nalog pravi DefaultRoleSeeder,
# na njega se testovi prijave i oslanjaju.
app.demo-data=false
app.admin-password=admin123

jwt.secret=test-tajni-kljuc-za-testove-najmanje-32-karaktera
jwt.expiration-ms=3600000
