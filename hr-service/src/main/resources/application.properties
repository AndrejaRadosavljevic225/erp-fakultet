spring.application.name=hr-service
server.port=8081

# --- Baza (Postgres iz docker-compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_hr
spring.datasource.username=erp
spring.datasource.password=erp
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=update: Hibernate pravi/azurira seme iz entiteta (dev rezim).
# Kasnije preci na Flyway migracije i staviti ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
# Iskljucen jer su migracije trenutno prazne; Hibernate upravlja semom u dev-u.
spring.flyway.enabled=false

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=hr-service
spring.kafka.consumer.auto-offset-reset=earliest

# --- Actuator / Swagger ---
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# --- JWT ---
# NAPOMENA: u produkciji cuvati tajni kljuc van koda (env varijabla). Mora biti >= 32 karaktera (HS256).
jwt.secret=erp-fakultet-hr-service-super-tajni-kljuc-promeni-me-2026
jwt.expiration-ms=86400000
