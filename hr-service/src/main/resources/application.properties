spring.application.name=hr-service
server.port=8081

# Aktivan profil (difolt: dev). U produkciji: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Baza (host/kredencijali iz env varijabli, dev fallback) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erp_hr}
spring.datasource.username=${DB_USER:erp}
spring.datasource.password=${DB_PASSWORD:erp}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA (zajednicko; ddl-auto i show-sql su po profilu) ---
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway (iskljucen; Hibernate + anotacije upravljaju semom) ---
spring.flyway.enabled=false

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=hr-service
spring.kafka.consumer.auto-offset-reset=earliest

# --- Actuator / Swagger ---
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# --- JWT ---
# Tajni kljuc se cita iz env varijable JWT_SECRET (dev fallback ispod).
# U PRODUKCIJI OBAVEZNO postaviti JWT_SECRET (>= 32 karaktera, HS256).
jwt.secret=${JWT_SECRET:erp-fakultet-hr-service-super-tajni-kljuc-promeni-me-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
