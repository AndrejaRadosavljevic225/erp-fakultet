# Konfiguracija SAMO za testove: baza u memoriji, bez Flyway-a i demo podataka.
# Ovaj fajl potpuno zamenjuje main/resources/application.properties tokom testova.
spring.application.name=schedule-service-test

spring.datasource.url=jdbc:h2:mem:schedule-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Seeder se ne pokrece u testovima — svaki test sam priprema svoje podatke.
app.demo-data=false

jwt.secret=test-tajni-kljuc-za-testove-najmanje-32-karaktera
jwt.expiration-ms=3600000
