spring.application.name=schedule-service
server.port=8083

# --- Baza (Postgres iz docker-compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_schedule
spring.datasource.username=erp
spring.datasource.password=erp
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=false

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=schedule-service
spring.kafka.consumer.auto-offset-reset=earliest

# --- Actuator / Swagger ---
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# --- JWT (isti tajni kljuc kao hr-service da bi tokeni radili prekoservisno) ---
jwt.secret=erp-fakultet-hr-service-super-tajni-kljuc-promeni-me-2026
