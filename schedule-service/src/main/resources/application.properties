spring.application.name=schedule-service
server.port=8083

# Aktivan profil (difolt: dev). U produkciji: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Baza ---
# Sistem nije vezan za jedan mehanizam baze. Cela JDBC adresa se moze zameniti
# promenljivom DB_URL (npr. jdbc:mysql://... ili jdbc:h2:mem:...); drajver i dijalekt
# Spring i Hibernate odredjuju iz same adrese, pa nista drugo ne treba menjati.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erp_schedule}}
spring.datasource.username=${DB_USER:erp}
spring.datasource.password=${DB_PASSWORD:erp}

# --- JPA (zajednicko; ddl-auto i show-sql su po profilu) ---
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway (iskljucen; Hibernate + anotacije upravljaju semom) ---
spring.flyway.enabled=false

# --- Actuator / Swagger ---
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# --- JWT (isti tajni kljuc kao hr-service da tokeni rade prekoservisno) ---
# Cita se iz env varijable JWT_SECRET (dev fallback ispod); u prod-u OBAVEZNO postaviti.
jwt.secret=${JWT_SECRET:erp-fakultet-hr-service-super-tajni-kljuc-promeni-me-2026}
