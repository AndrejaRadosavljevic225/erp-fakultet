spring.application.name=finance-service
server.port=8082

# --- Baza (Postgres iz docker-compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_finance
spring.datasource.username=erp
spring.datasource.password=erp
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=false

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=finance-service
spring.kafka.consumer.auto-offset-reset=earliest

# --- Actuator / Swagger ---
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
