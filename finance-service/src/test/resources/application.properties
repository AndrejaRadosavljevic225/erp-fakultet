# Konfiguracija SAMO za testove. Finansijski modul jos nije implementiran, ali njegov
# generisani test podize Spring kontekst — bez ovoga bi trazio pokrenut Postgres i rusio
# `mvn test` za ceo repozitorijum. Baza u memoriji resava to bez ikakve izmene koda.
spring.application.name=finance-service-test

spring.datasource.url=jdbc:h2:mem:finance-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false
