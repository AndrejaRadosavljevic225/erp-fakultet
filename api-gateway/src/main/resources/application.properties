spring.application.name=api-gateway
server.port=8080

# gateway-server-webmvc je servlet-based; pom sadrzi i webflux pa eksplicitno biramo servlet
spring.main.web-application-type=servlet

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,gateway
# Redis nije deo ovog sistema; iskljuci fantomski Redis health check (localhost:6379)
management.health.redis.enabled=false

# --- Rute ka mikroservisima (Spring Cloud Gateway Server WebMVC 5.x) ---
# Frontend gadja jedan URL:
#   HR:        http://localhost:8080/hr/api/...        -> http://localhost:8081/api/...
#   Schedule:  http://localhost:8080/schedule/api/...  -> http://localhost:8083/api/...
# StripPrefix=1 uklanja prvi segment (/hr, /schedule) pre prosledjivanja.

spring.cloud.gateway.server.webmvc.routes[0].id=hr-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/hr/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=schedule-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/schedule/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=finance-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/finance/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1
